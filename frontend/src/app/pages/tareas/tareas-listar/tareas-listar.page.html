<div class="tarjetas">
  @for (tarea of this.tareas(); track tarea.id_tarea) {
    <app-tarea-card
      [tarea]="tarea"
      (editar)="this.onEditar($event)"
      (eliminar)="this.onEliminar($event)"
    ></app-tarea-card>
  } @empty {
    <p>No se encontraron tareas registradas.</p>
  }
</div>
<button type="button" (click)="this.goToCrear()">Crear Tarea</button>
